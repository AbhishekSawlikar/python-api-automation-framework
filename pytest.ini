[pytest]
minversion = 8.0
addopts = -ra -q --alluredir=reports/allure_result --html=reports/html/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    crud: Full CRUD suite
    smoke: Critical sanity checks
    regression: Full regression suite
    integration: API-to-UI end-to-end sync checks